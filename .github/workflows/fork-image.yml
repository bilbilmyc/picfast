name: Fork Development Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'web/**'
      - 'migrations/**'
      - 'api/**'
      - 'go.mod'
      - 'go.sum'
      - 'docker/Dockerfile'
      - '.dockerignore'
      - '.github/workflows/fork-image.yml'

concurrency:
  group: fork-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    if: github.repository != 'atbeta/picfast' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    outputs:
      image_name: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Prepare image metadata
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish native platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:dev-${{ github.sha }}-${{ matrix.arch }}
          build-args: |
            VERSION=dev-${{ github.sha }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.image.outputs.build_time }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=picfast-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=picfast-${{ matrix.arch }}

  publish:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish and verify multi-platform image
        env:
          IMAGE_NAME: ${{ needs.image.outputs.image_name }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:dev-main" \
            --tag "${IMAGE_NAME}:dev-${GITHUB_SHA}" \
            "${IMAGE_NAME}:dev-${GITHUB_SHA}-amd64" \
            "${IMAGE_NAME}:dev-${GITHUB_SHA}-arm64"
          docker buildx imagetools inspect "${IMAGE_NAME}:dev-${GITHUB_SHA}"
          docker buildx imagetools inspect --raw "${IMAGE_NAME}:dev-${GITHUB_SHA}" > manifest.json
          jq -e '[.manifests[].platform | .os + "/" + .architecture] | contains(["linux/amd64", "linux/arm64"])' manifest.json
